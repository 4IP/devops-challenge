image:
  repository: 111111111111.dkr.ecr.ap-southeast-3.amazonaws.com/claims-worker
  tag: "1.14.0"

serviceAccount:
  name: claims-worker
  roleArn: arn:aws:iam::111111111111:role/claims-worker-dev

env:
  AWS_REGION: ap-southeast-3
  QUEUE_URL: https://sqs.ap-southeast-3.amazonaws.com/111111111111/claims-documents-dev
  DOCUMENTS_BUCKET: acme-claims-documents-dev
  WORKER_CONCURRENCY: "2"

resources:
  requests:
    cpu: 250m
    memory: 512Mi
  limits:
    memory: 1Gi

# DATABASE_URL lives in the claims-worker-db Secret (was a plaintext password in this file and
# therefore in git history; rotate it). See docs/takeover.md.
envFromSecrets:
  - claims-worker-db

autoscaling:
  enabled: true
  minReplicas: 0
  maxReplicas: 3
  queueLength: 20
