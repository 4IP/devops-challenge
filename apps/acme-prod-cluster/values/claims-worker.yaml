image:
  repository: 111111111111.dkr.ecr.ap-southeast-3.amazonaws.com/claims-worker
  tag: latest

serviceAccount:
  # MUST match `service_account` in live/acme/ap-southeast-3/claims/prod/claims-worker-iam.
  # The IRSA trust policy is bound to system:serviceaccount:claims:claims-worker.
  # Renaming this without changing the IAM stack first breaks every worker pod
  # (see docs/incident-2026-10-14-claims-worker.md). CI checks this (scripts/check-irsa-service-accounts.py).
  name: claims-worker
  roleArn: arn:aws:iam::111111111111:role/claims-worker-prod

env:
  AWS_REGION: ap-southeast-3
  QUEUE_URL: https://sqs.ap-southeast-3.amazonaws.com/111111111111/claims-documents
  DATABASE_URL: postgres://claims:Cl41ms-Pr0d-2024!@claims-db.prod.acme.internal:5432/claims
  WORKER_CONCURRENCY: "4"

autoscaling:
  enabled: true
  minReplicas: 1
  maxReplicas: 30
  queueLength: 20
